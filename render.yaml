# ============================================================
# RENDER BLUEPRINT — DocVault Full Stack Deployment
# ============================================================

services:

  # ---------- BACKEND (FastAPI Microservice) ----------
  - type: web
    name: docvault-backend
    env: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: vault_documents
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_API_BASE
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_VISION_MODEL
        value: meta/llama-3.2-11b-vision-instruct
      - key: NVIDIA_TEXT_MODEL
        value: google/gemma-2-2b-it
      - key: ALLOWED_ORIGINS
        sync: false             # Set to your deployed frontend URL on Render/Vercel

  # ---------- FRONTEND (Vite React Static Site) ----------
  - type: web
    name: docvault-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false             # Set to https://docvault-backend.onrender.com/api after backend is live
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
